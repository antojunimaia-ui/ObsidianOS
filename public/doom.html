<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>ObsidianOS DOOM Player</title>
    <style>
        html, body, #jsdos {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
        }
    </style>
    <script src="https://js-dos.com/v7/build/releases/latest/js-dos/js-dos.js"></script>
    <link href="https://js-dos.com/v7/build/releases/latest/js-dos/js-dos.css" rel="stylesheet">
</head>
<body>
    <div id="jsdos"></div>
    <script>
        // Inicializa o js-dos com o DOOM Shareware via Proxy de CORS
        emulators.pathPrefix = "https://js-dos.com/v7/build/releases/latest/js-dos/";
        
        // Usando o proxy AllOrigins para contornar o erro de CORS no localhost
        const bundleUrl = "https://cdn.dos.zone/custom/dos/doom.jsdos";
        const proxyUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent(bundleUrl);

        Dos(document.getElementById("jsdos"), {
            style: "hidden",
        }).run(proxyUrl);
    </script>
</body>
</html>
